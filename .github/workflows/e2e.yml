name: E2E tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PostgreSQL backend
        uses: actions/checkout@v6
        with:
          repository: wasnaker/brocoders-api
          ref: ${{ github.event_name == 'pull_request' && 'feat/universal-module-runtime' || 'main' }}
          path: backend

      - name: Start PostgreSQL, MailDev, and API
        run: |
          cd backend
          docker compose -f docker-compose.relational.test.yaml --env-file env-example-relational up -d postgres
          docker compose -f docker-compose.relational.test.yaml --env-file env-example-relational run --detach --no-deps --publish 1080:1080 --publish 1025:1025 --name e2e-maildev maildev
          docker compose -f docker-compose.relational.test.yaml --env-file env-example-relational run --detach --no-deps --publish 3001:3001 --name e2e-api api

      - name: Wait for PostgreSQL API
        run: cd backend && ./wait-for-it.sh localhost:3001 -t 600 --strict -- echo "PostgreSQL API is up"

      - name: Check out frontend
        uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Install Playwright browsers (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - name: Capture backend logs
        if: failure()
        run: |
          docker logs e2e-api > ${{ runner.temp }}/backend.log 2>&1 || true
          docker logs e2e-maildev >> ${{ runner.temp }}/backend.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-log
          path: ${{ runner.temp }}/backend.log
          retention-days: 30
      - name: Stop PostgreSQL test stack
        if: always()
        run: |
          docker rm -f e2e-api e2e-maildev 2>/dev/null || true
          cd backend
          docker compose -f docker-compose.relational.test.yaml --env-file env-example-relational down -v --remove-orphans
