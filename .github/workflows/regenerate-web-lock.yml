name: Regenerate npm lockfile
run-name: Regenerate web lockfile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/regenerate-web-lock.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.event.head_commit.message == 'chore(ci): regenerate web lockfile' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate npm lockfile"
          git push
